[project]
name = "transit-media-backend"
version = "0.1.0"
description = "Transit Media Campaign Recommendation System - FastAPI + LangGraph Deep Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "deepagents>=0.2",
    "langchain-google-genai>=4.3",
    "langgraph>=0.3",
    # HiGHS MILP backend for app/optimize/solver.py, via scipy.optimize.milp. Was already
    # present transitively through scikit-learn; declared because we call it directly.
    # `pulp` was declared for an optimizer that was never written that way and is dropped.
    "scipy>=1.11",
    # >=1.6 for sklearn.frozen.FrozenEstimator, used by the booking-probability
    # calibration in app/ml/booking_probability.py.
    "scikit-learn>=1.6",
    "lightgbm>=4.5",
    "python-dotenv>=1.0",
    # Campaign brief parsing (app/services/documents.py). Both are pure Python with no
    # system libraries, which is why they were picked over pdfminer/PyMuPDF: the uploads
    # path has to work on a laptop with no build toolchain.
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "FURB", "ISC"]
# Campaign dates and localDB timestamps are deliberately timezone-naive: the source
# datasets carry date-only fields, and city timezones live in cities.csv when needed.
ignore = ["ISC001"]

[tool.ruff.lint.per-file-ignores]
# B008: `File(...)`/`Form(...)` in argument defaults is the required FastAPI idiom.
"app/api/uploads.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
